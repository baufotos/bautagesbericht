# Render Blueprint — richtet die komplette App als EINEN Docker-Dienst ein
# (Backend + Frontend im selben Container, siehe Dockerfile + start.sh).
#
# So wird es benutzt:
#   1. Code zu GitHub hochladen (siehe ANLEITUNG-ONLINE-STELLEN.md).
#   2. Auf https://dashboard.render.com -> New -> Blueprint das Repo auswählen.
#      Render liest diese Datei und legt den Dienst an.
#   3. Beim Anlegen fragt Render nach den mit "sync: false" markierten Werten
#      (Datenbank-URL, optional Teams-Webhook, optional Anthropic-Key).
#
# Die Datenbank läuft bei Neon (dauerhaft kostenlos). Kein databases-Block —
# die Neon-URL kommt als BTB_DATABASE_URL rein.

services:
  - type: web
    name: bautagesbericht
    runtime: docker
    plan: free
    # Wurzel des Dienstes im Repo. MUSS der Unterordner sein, in dem dieser
    # Code liegt — im Repo steht alles unter "Bautagesbericht-GitHub-Upload/",
    # die Repo-Wurzel enthält sonst nichts. Stand hier einmal ".", fand der
    # Docker-Build die Dockerfile nicht ("failed to read dockerfile") und der
    # Dienst ließ sich nicht mehr neu ausrollen. Wichtig: Render gleicht diese
    # Datei automatisch ab (Blueprint, autoSync) und überschreibt dabei die im
    # Dashboard eingestellte Wurzel — der richtige Wert muss deshalb hier
    # stehen, nicht nur dort.
    rootDir: Bautagesbericht-GitHub-Upload
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # ── Umfang der Weboberfläche ──
    #
    # Die Website zeigt nur Baufotos und die Projekt-Stammdaten. Der Schalter
    # dafür steht NICHT hier, sondern als "ARG APP_UMFANG=fotos" in der
    # Dockerfile: Der Wert wird beim Bauen ins JavaScript-Bündel eingesetzt,
    # eine Umgebungsvariable des laufenden Dienstes käme dafür zu spät. Wer
    # die Website wieder vollständig braucht, ändert die Zeile in der
    # Dockerfile und stößt ein neues Deploy an.
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Interner Proxy: Frontend -> Backend im selben Container.
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      # Neon-Postgres-URL — MUSS mit "postgresql+psycopg://" beginnen.
      - key: BTB_DATABASE_URL
        sync: false
      # Optional: Anthropic-Key nur für das Auslesen eingescannter Berichte.
      - key: BTB_ANTHROPIC_API_KEY
        sync: false
      # Optional: gemeinsamer Teams-Kanal-Webhook als Fallback, falls ein
      # Empfänger keinen eigenen Kanal hinterlegt hat (siehe Stammdaten ·
      # Empfänger in der App). Leer lassen = keine Teams-Benachrichtigung,
      # der Bericht bleibt trotzdem in der Übersichtsseite als Download
      # verfügbar. Einrichtung: im Teams-Kanal "..." -> Workflows -> Vorlage
      # "Send webhook alerts to a channel" -> Webhook-URL kopieren und hier
      # eintragen.
      - key: BTB_TEAMS_WEBHOOK_URL
        sync: false
      # ── Wo hochgeladene Fotos liegen ──
      #
      # "db" ist hier Pflicht, nicht Geschmackssache: Das Dateisystem des
      # Containers ist flüchtig. Der Dienst schläft nach 15 Minuten ohne
      # Zugriff ein und startet beim Aufwachen — wie bei jedem Deploy — leer.
      # Fotos wären dann weg, während in der Datenbank noch ihre Verweise
      # stehen. Für Baustellenfotos, die erst abends vom Bürorechner abgeholt
      # werden, ist das nicht tragbar.
      #
      # Die Datenbank ist dabei ein Durchgang, kein Archiv: Ein Fotosatz liegt
      # dort von der Baustelle bis zum Bürorechner. Was quittiert ist, wird
      # nach der Schonfrist wieder freigegeben — das Archiv ist der
      # Projektordner auf dem Netzlaufwerk.
      #
      # Kein zusätzlicher Dienst nötig, keine Zusatzkosten.
      - key: BTB_FOTOSPEICHER
        value: db
      # Tage, die abgeholte Sätze noch mit Bildern in der Datenbank bleiben
      # (damit die Galerie direkt nach dem Termin Vorschaubilder zeigt).
      - key: BTB_FOTOS_AUFBEWAHREN_TAGE
        value: "2"
      # Obergrenze der Bilddaten in MB. Darüber werden zusätzlich die
      # ältesten bereits abgeholten Sätze geleert. Noch nicht abgeholte Sätze
      # bleiben unter allen Umständen liegen.
      - key: BTB_FOTOS_MAX_MB
        value: "300"
      # Losungswort für die Abholskripte der Bürorechner — derselbe Wert muss
      # in deren einstellungen.txt stehen (Feld "token").
      #
      # PFLICHT, sobald BTB_SEITEN_PASSWORT gesetzt ist: Die Abholung ist vom
      # Seiten-Passwort ausgenommen (die Skripte kennen keine Anmeldung), und
      # dieses Wort ist dann ihr einziger Ausweis. Fehlt es, bekommt die
      # Abholung 401 — absichtlich, denn sonst wäre der ZIP-Download unter
      # /api/fotosaetze/<Nummer>/zip für jeden mit dem Link erreichbar, und
      # die Nummern sind fortlaufend. Siehe backend/app/security.py.
      - key: BTB_ABHOL_TOKEN
        sync: false
      # Passwort für die Weboberfläche selbst (siehe ANLEITUNG-ONLINE-STELLEN.md,
      # Abschnitt "Passwortschutz"). Wird NUR bei Render gesetzt, nie lokal
      # oder im Windows-Paket. Ohne diesen Wert ist die Seite für jeden mit
      # dem Link offen, auch zum Hochladen von Baufotos.
      - key: BTB_SEITEN_PASSWORT
        sync: false

  # ─────────────────────────────────────────────────────────────────────────
  # ZWEITER DIENST — die Büro-Website (voller Funktionsumfang)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Zwei getrennte Adressen, ein Programm, eine Datenbank:
  #
  #   bautagesbericht          Baustelle. Dashboard, Baufotos, Projekte.
  #   hpp-baumanagement-buero  Büro. Zusätzlich Mängelberichte,
  #                            Baubesprechungen, Bautagesberichte, Schreiben.
  #
  # Der Unterschied ist EIN Wert: APP_UMFANG. Er wird von Render automatisch
  # als Docker-Build-Argument durchgereicht, deshalb genügt für beide Dienste
  # dieselbe Dockerfile — und deshalb bekommt nur dieser Dienst LibreOffice
  # für den PDF-Export mit ins Image (siehe Dockerfile).
  #
  # Die Datenbank ist mit Absicht dieselbe: Was auf der Baustelle
  # hochgeladen wird, steht sofort im Büro zur Verfügung, und die Projekte
  # werden nur an einer Stelle gepflegt. Der Preis dafür ist, dass die Werte
  # unten mit denen des ersten Dienstes übereinstimmen MÜSSEN.
  #
  # Warum die Geheimwerte hier trotzdem noch einmal einzeln stehen und nicht
  # per "fromService" vom ersten Dienst geholt werden: Render kann Werte mit
  # "sync: false" nicht zwischen Diensten weiterreichen. Sie einmal von Hand
  # einzutragen ist der sichere Weg — jeder Versuch, sie stattdessen in eine
  # gemeinsame Gruppe zu verschieben, würde sie dem laufenden ersten Dienst
  # beim nächsten Blueprint-Abgleich wegnehmen.
  - type: web
    name: hpp-baumanagement-buero
    runtime: docker
    plan: free
    rootDir: Bautagesbericht-GitHub-Upload
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Interner Proxy: Frontend -> Backend im selben Container.
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      # ── Der einzige echte Unterschied zur Baustellen-Seite ──
      #
      # "buero" schaltet alle Bereiche frei AUSSER den Baufotos — die haben
      # ihre eigene Website, und beide hängen an derselben Datenbank. Der
      # Wert sorgt zugleich dafür, dass die Dockerfile LibreOffice
      # installiert; ohne das gäbe es hier kein "Als PDF", denn auf Linux
      # lässt sich Word nicht ansteuern.
      #
      # NICHT auf "voll" ändern: Das ist der Umfang des Windows-Pakets und
      # brächte die Baufotos hier ein zweites Mal in die Navigation.
      - key: APP_UMFANG
        value: buero
      # ── Gemeinsame Datenbank ──
      # DERSELBE Wert wie beim Dienst "bautagesbericht", sonst sind es zwei
      # getrennte Datenbestände und die Baustellenfotos fehlen im Büro.
      # Muss mit "postgresql+psycopg://" beginnen.
      - key: BTB_DATABASE_URL
        sync: false
      # ── Passwort der Weboberfläche ──
      # Nach Absprache derselbe Wert wie bei der Baustellen-Seite.
      - key: BTB_SEITEN_PASSWORT
        sync: false
      # Losungswort der Foto-Abholung. Denselben Wert eintragen wie beim
      # ersten Dienst, damit die Abholskripte der Bürorechner auch gegen
      # diese Adresse arbeiten können. Pflicht, sobald oben ein Passwort
      # steht (siehe backend/app/security.py).
      - key: BTB_ABHOL_TOKEN
        sync: false
      # ── Fotospeicher ──
      # MUSS "db" sein wie beim ersten Dienst: Beide schreiben in dieselbe
      # Datenbank, und das Dateisystem des Containers ist flüchtig. Stünde
      # hier "datei", lägen die hier hochgeladenen Bilder auf einer Platte,
      # die beim nächsten Einschlafen des Dienstes verschwindet — während
      # die Datenbank ihre Verweise behielte.
      - key: BTB_FOTOSPEICHER
        value: db
      - key: BTB_FOTOS_AUFBEWAHREN_TAGE
        value: "2"
      - key: BTB_FOTOS_MAX_MB
        value: "300"
      # ── Texterkennung eingescannter Bautagesberichte ──
      #
      # Hier ist der Schlüssel wichtiger als auf der Baustellen-Seite: Die
      # Bautagesberichte werden in diesem Dienst eingelesen, und im
      # Linux-Container gibt es die Windows-Texterkennung nicht. OHNE diesen
      # Wert kann online GAR KEIN Scan gelesen werden — weder gedruckt noch
      # handschriftlich. Die Oberfläche sagt das dann von sich aus
      # (erkennung_beschreibung() in services/pdf_extraction.py), es geht
      # also nichts still verloren; die Angaben müssen aber von Hand
      # eingetippt werden.
      - key: BTB_ANTHROPIC_API_KEY
        sync: false
      # ── Optional: Teams-Kanal als Rückfallweg für Benachrichtigungen ──
      - key: BTB_TEAMS_WEBHOOK_URL
        sync: false
      # ── Optional: Mailversand ──
      # Ohne BTB_SMTP_HOST bietet die App weiterhin den Outlook-Entwurf an,
      # verschickt aber nichts selbst.
      - key: BTB_SMTP_PORT
        value: "587"
      - key: BTB_SMTP_HOST
        sync: false
      - key: BTB_SMTP_USER
        sync: false
      - key: BTB_SMTP_PASSWORT
        sync: false
      - key: BTB_SMTP_ABSENDER
        sync: false
