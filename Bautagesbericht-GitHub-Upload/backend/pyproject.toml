[project]
name = "bautagesbericht-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # Direkt genutzt vom Mängelmodul: Fotos drehen/verkleinern (Pillow) und
    # PDF-Pläne als Bild rendern (pypdfium2). Beide kamen bisher nur
    # transitiv über pdfplumber mit — hier stehen sie, weil der Code sie
    # selbst importiert (app.services.bilder, app.services.plan_vorschau).
    "pillow>=10.0",
    # HEIC/HEIF: iPhones fotografieren so. Ohne dieses Paket landen deren
    # Fotos unverarbeitet im Projektordner (app.services.bildformate).
    "pillow-heif>=0.18",
    "pypdfium2>=4.18",
    "docxtpl>=0.18",
    "anthropic>=0.40",
    # Dauerhafter Fotospeicher auf Cloudflare R2 (S3-kompatibel). Nur nötig,
    # wenn die vier BTB_R2_*-Werte gesetzt sind — auf dem Bürorechner läuft
    # die App ohne, dort ist die Festplatte selbst dauerhaft
    # (app.services.fotospeicher).
    "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
